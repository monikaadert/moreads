<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>moreads</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#16030a;--p:#2a0813;--p2:#3a0c1b;--c:#b01538;--c2:#e0405f;--tx:#ffe9ee;--mu:#d9a3b0;--g:#e9c9a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(circle at 20% 0,#4a0a1e 0,var(--bg) 55%) fixed;color:var(--tx);font:16px/1.5 Nunito,system-ui,sans-serif;text-transform:lowercase;min-height:100vh}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:.2em 0;font-weight:700}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;flex-wrap:wrap;border-bottom:1px solid #5a1228;background:#1f040c}
.logo{display:flex;gap:10px;align-items:center;font:700 28px 'Playfair Display',serif;color:#ffd1da;letter-spacing:1px}
select,input,textarea,button{font:inherit;color:var(--tx);background:#240610;border:1px solid #6a1830;border-radius:12px;padding:8px 12px;text-transform:lowercase}
textarea{width:100%;min-height:70px;resize:vertical}input[type=color]{padding:0;width:44px;height:36px}input[type=range]{padding:0}
button{cursor:pointer;background:linear-gradient(180deg,var(--c2),var(--c));border:0;font-weight:700;box-shadow:0 4px 0 #6e0c24,0 8px 16px #0008;transition:.1s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #6e0c24}
button.g{background:#3a0c1b;box-shadow:none;border:1px solid #6a1830}button.on{background:linear-gradient(180deg,var(--c2),var(--c))}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 18px}nav button{white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:6px 18px 60px}
.card{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid #5a1228;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0007}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu);font-size:14px}
.e{display:inline-block;filter:drop-shadow(0 3px 2px #000a) drop-shadow(0 0 6px #ff4d6d66);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(4deg)}}
.st{cursor:pointer;font-size:22px;opacity:.3;filter:grayscale(.6)}.st.on{opacity:1;filter:drop-shadow(0 2px 2px #000a)}
.cover{width:100%;max-height:180px;object-fit:cover;border-radius:12px;border:2px solid var(--g)}
.chip{padding:4px 10px;font-size:13px}.msg{padding:8px 12px;border-radius:14px;margin:6px 0;background:#3a0c1b;max-width:85%}.msg.me{background:var(--c);margin-left:auto}
.big{font-size:44px}.az{display:flex;gap:4px;flex-wrap:wrap}.az button{padding:2px 9px;font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin-top:8px}
</style></head><body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const LG=[['en','english'],['uk','українська'],['ru','русский'],['de','deutsch'],['it','italiano'],['pl','polski'],['lt','lietuvių'],['tr','türkçe'],['es','español'],['th','ไทย']];
const TT={en:'read books|discussions|in the process of reading|want to read|top recommendations|friends & chat|my assistant|add|save|post',
uk:'прочитані книги|обговорення|читаю зараз|хочу прочитати|топ рекомендацій|друзі й чат|мій помічник|додати|зберегти|опублікувати',
ru:'прочитанные книги|обсуждения|читаю сейчас|хочу прочитать|топ рекомендаций|друзья и чат|мой помощник|добавить|сохранить|опубликовать',
de:'gelesene bücher|diskussionen|ich lese gerade|will ich lesen|top-empfehlungen|freunde & chat|mein assistent|hinzufügen|speichern|posten',
it:'libri letti|discussioni|in lettura|da leggere|migliori consigli|amici e chat|il mio assistente|aggiungi|salva|pubblica',
pl:'przeczytane książki|dyskusje|w trakcie czytania|chcę przeczytać|top polecenia|znajomi i czat|mój asystent|dodaj|zapisz|opublikuj',
lt:'perskaitytos knygos|diskusijos|skaitau dabar|noriu perskaityti|geriausios rekomendacijos|draugai ir pokalbiai|mano padėjėjas|pridėti|išsaugoti|paskelbti',
tr:'okunan kitaplar|tartışmalar|okunuyor|okumak istiyorum|en iyi öneriler|arkadaşlar ve sohbet|asistanım|ekle|kaydet|paylaş',
es:'libros leídos|debates|leyendo ahora|quiero leer|mejores recomendaciones|amigos y chat|mi asistente|añadir|guardar|publicar',
th:'หนังสือที่อ่านแล้ว|กระทู้สนทนา|กำลังอ่าน|อยากอ่าน|หนังสือแนะนำยอดนิยม|เพื่อนและแชท|ผู้ช่วยของฉัน|เพิ่ม|บันทึก|โพสต์'};
const TI=['📚','💬','📖','🔖','🏆','👯','🧑‍🎤'],TK=['read','disc','reading','want','top','friends','helper'];
const tr=i=>(TT[me.lang]||TT.en).split('|')[i];
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me={books:[],reading:[],want:[],friends:[],lang:'en',av:{name:'mia',g:'f',age:24,skin:'#f1c9a5',hair:'#5a2a1a',style:'long',eyes:'#3b2a20',acc:['bow'],cl:'#c2183f',ct:'sweater',bd:''}};
let uid=null,db=null,usr=null,tab='read',F={r:{}},img='',dl='en',dbk='',P=[],R=[],M=[],cf=null,unsub=null,names={},azf='';
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
async function save(){try{if(db&&uid)await db.collection('data/users/'+uid).doc('main').set(me);else localStorage.setItem('mr',JSON.stringify(me))}catch(x){}}
async function fillNames(){const sp=[...document.querySelectorAll('[data-u]')];const need=[...new Set(sp.map(s=>s.dataset.u))].filter(i=>!names[i]);
 if(need.length&&usr&&usr.profiles){try{const ps=await usr.profiles(need);need.forEach(i=>names[i]=(ps[i]&&ps[i].name)||'reader '+i.slice(0,4))}catch(x){}}
 sp.forEach(s=>s.textContent=s.dataset.u===uid?'you':(names[s.dataset.u]||'reader '+s.dataset.u.slice(0,4)))}
function stop(){if(unsub){unsub();unsub=null}}
function go(t){tab=t;stop();render();sub()}
function sub(){if(!db)return;
 if(tab==='disc'){unsub=db.collection('posts').where('lang','==',dl).onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));paintDisc()})}
 if(tab==='top'){unsub=db.collection('recs').onSnapshot(s=>{R=s.docs.map(d=>({id:d.id,...d.data()}));paintTop()})}
 if(tab==='friends'&&cf){unsub=db.collection('msgs').where('pair','==',pair(cf)).onSnapshot(s=>{M=s.docs.map(d=>d.data()).sort((a,b)=>a.t-b.t);paintChat()})}}
const pair=f=>[uid,f].sort().join('_');
function stars(k,n){return [1,2,3,4,5].map(i=>`<span class="st e ${i<=n?'on':''}" onclick="setR('${k}',${i})" style="animation:none">${{o:'⭐',l:'💗',t:'😢',f:'😂'}[k]}</span>`).join('')}
function setR(k,n){F.r[k]=n;document.getElementById('s'+k).innerHTML=stars(k,n)}
const ro=(k,l)=>`<div class="row"><span style="width:110px" class="mu">${l}</span><span id="s${k}">${stars(k,F.r[k]||0)}</span></div>`;
function render(){
 const hd=`<header><div class="logo">${logo()}moreads <span class="e">🍒</span></div><div class="row"><span class="mu">${uid?'signed in · saved automatically <button class="g chip" onclick="firebase.auth().signOut()">sign out</button>':'<button class="chip" onclick="signIn()">sign in with google</button>'}</span><select onchange="me.lang=this.value;save();render()">${LG.map(l=>`<option value="${l[0]}" ${l[0]===me.lang?'selected':''}>${l[1]}</option>`).join('')}</select></div></header>`;
 const nv=`<nav>${TK.map((k,i)=>`<button class="${tab===k?'on':'g'}" onclick="go('${k}')"><span class="e">${TI[i]}</span> ${tr(i)}</button>`).join('')}</nav>`;
 document.getElementById('app').innerHTML=hd+nv+'<main id="m"></main>';
 ({read:vRead,disc:vDisc,reading:vList,want:vList,top:vTop,friends:vFr,helper:vHelp})[tab]();
 fillNames()}
function logo(){return `<svg width="46" height="46" viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5d7d"/><stop offset="1" stop-color="#7a0a25"/></linearGradient></defs><path d="M9 6h27a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H9z" fill="url(#lg)" stroke="#e9c9a0" stroke-width="2"/><path d="M9 6v36" stroke="#3a0412" stroke-width="5"/><path d="M42 12v26h-3" stroke="#f6e3c8" stroke-width="3" fill="none"/><text x="25" y="32" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-weight="700" font-size="22" fill="#ffe9c9">M</text></svg>`}
/* read books */
function vRead(){const bs=me.books,ls=[...new Set(bs.map(b=>(b.title[0]||'#').toLowerCase()))].sort();
 document.getElementById('m').innerHTML=`<div class="card"><h2><span class="e">✍️</span> new book entry</h2><div class="grid"><div><label>title</label><input id="bt" style="width:100%"><label>author</label><input id="ba" style="width:100%"></div><div><label>annotation</label><textarea id="bn"></textarea></div><div><label>my impressions</label><textarea id="bi"></textarea></div></div>
 ${ro('o','overall')}${ro('l','love line')}${ro('t','tragic moments')}${ro('f','funny moments')}
 <label>picture (aesthetic cover, quote, photo)</label><input type="file" accept="image/*" onchange="pic(this)"><div id="pv"></div><br><button onclick="addBook()">${tr(7)} 🍒</button></div>
 <div class="az"><button class="${azf?'g':'on'} chip" onclick="azf='';render()">all</button>${ls.map(l=>`<button class="chip ${azf===l?'on':'g'}" onclick="azf='${l}';render()">${e(l)}</button>`).join('')}</div>
 <div class="grid">${bs.map((b,i)=>({b,i})).filter(x=>!azf||x.b.title[0].toLowerCase()===azf).map(({b,i})=>`<div class="card">${b.img?`<img class="cover" src="${b.img}">`:''}<h3>${e(b.title)}</h3><div class="mu">${e(b.author)}</div><p>${e(b.ann)}</p><p><i>${e(b.imp)}</i></p>${['o','l','t','f'].map(k=>b.r[k]?`<div>${{o:'⭐',l:'💗',t:'😢',f:'😂'}[k]} ${'★'.repeat(b.r[k])}<span style="opacity:.3">${'★'.repeat(5-b.r[k])}</span></div>`:'').join('')}<button class="g chip" onclick="me.books.splice(${i},1);save();render()">delete</button></div>`).join('')||'<p class="mu">no books yet <span class="e">📚</span> add your first one above</p>'}</div>`}
function pic(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,320/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.7);document.getElementById('pv').innerHTML=`<img class="cover" src="${img}">`};im.src=r.result};r.readAsDataURL(f)}
function addBook(){const t=v('bt').trim();if(!t)return;me.books.push({title:t,author:v('ba'),ann:v('bn'),imp:v('bi'),r:{...F.r},img});F={r:{}};img='';save();render()}
const v=i=>document.getElementById(i).value;
/* reading / want */
function vList(){const k=tab,a=me[k];document.getElementById('m').innerHTML=`<div class="card"><h2><span class="e">${k==='want'?'🔖':'📖'}</span> ${tr(k==='want'?3:2)}</h2><div class="row"><input id="lt" placeholder="title"><input id="la" placeholder="author"><button onclick="addL()">${tr(7)}</button></div></div><div class="grid">${a.map((b,i)=>`<div class="card"><h3>${e(b.title)}</h3><div class="mu">${e(b.author)}</div>${k==='reading'?`<input type="range" min="0" max="100" value="${b.p||0}" style="width:100%" onchange="me.reading[${i}].p=+this.value;save()"><div class="mu">progress ✨</div>`:''}<div class="row"><button class="chip" onclick="mv(${i})">${k==='want'?'start reading 📖':'finished ✅'}</button><button class="g chip" onclick="me['${k}'].splice(${i},1);save();render()">×</button></div></div>`).join('')}</div>`}
function addL(){const t=v('lt').trim();if(!t)return;me[tab].push({title:t,author:v('la'),p:0});save();render()}
function mv(i){const b=me[tab].splice(i,1)[0];if(tab==='want')me.reading.push(b);else me.books.push({title:b.title,author:b.author,ann:'',imp:'',r:{},img:''});save();render()}
/* discussions */
function vDisc(){document.getElementById('m').innerHTML=`<div class="card"><h2><span class="e">🌍</span> choose a language branch</h2><div class="row">${LG.map(l=>`<button class="chip ${dl===l[0]?'on':'g'}" onclick="dl='${l[0]}';dbk='';stop();vDisc();sub()">${l[1]}</button>`).join('')}</div></div><div id="dd"></div>`;paintDisc()}
function paintDisc(){const d=document.getElementById('dd');if(!d)return;if(!db){d.innerHTML='<p class="mu">sign in with google to join discussions 🍒</p>';return}
 const bk=[...new Set(P.map(p=>p.book))];
 if(!dbk){d.innerHTML=`<div class="card"><h3>books in this branch</h3><div class="row">${bk.map(b=>`<button class="chip g" onclick="dbk=this.dataset.b;paintDisc()" data-b="${e(b)}">📕 ${e(b)}</button>`).join('')||'<span class="mu">nothing yet, be the first</span>'}</div><div class="row" style="margin-top:10px"><input id="nb" placeholder="new book title"><button onclick="dbk=v('nb').trim();paintDisc()">open</button></div></div>`;return}
 const ps=P.filter(p=>p.book===dbk).sort((a,b)=>a.t-b.t);
 d.innerHTML=`<div class="card"><button class="g chip" onclick="dbk='';paintDisc()">← books</button><h2>📕 ${e(dbk)}</h2>${ps.map(p=>`<div class="msg ${p.uid===uid?'me':''}"><b data-u="${e(p.uid)}"></b> <span class="mu">${new Date(p.t).toLocaleDateString()}</span><br>${e(p.text)}</div>`).join('')||'<p class="mu">no posts yet 😊</p>'}<textarea id="pt" placeholder="share your thoughts…"></textarea><button onclick="post()">${tr(9)} 💌</button></div>`;fillNames()}
async function post(){const t=v('pt').trim();if(!t||!uid)return;await db.collection('posts').doc(rid()).set({lang:dl,book:dbk,text:t,uid,t:Date.now()})}
/* top */
function vTop(){document.getElementById('m').innerHTML=`<div class="card"><h2><span class="e">🏆</span> ${tr(4)}</h2><div class="row"><input id="rt" placeholder="title"><input id="ra" placeholder="author"><button onclick="addRec()">recommend 🍒</button></div></div><div id="tt"></div>`;paintTop()}
function paintTop(){const d=document.getElementById('tt');if(!d)return;if(!db){d.innerHTML='<p class="mu">sign in with google to see recommendations</p>';return}
 d.innerHTML=[...R].sort((a,b)=>(b.v||[]).length-(a.v||[]).length).map((r,i)=>`<div class="card row"><span class="big e">${['🥇','🥈','🥉'][i]||'📗'}</span><div style="flex:1"><h3>${e(r.title)}</h3><span class="mu">${e(r.author)}</span></div><button class="chip ${(r.v||[]).includes(uid)?'on':'g'}" onclick="vote('${r.id}')">❤️ ${(r.v||[]).length}</button></div>`).join('')||'<p class="mu">no recommendations yet</p>'}
async function addRec(){const t=v('rt').trim();if(!t||!db)return;await db.collection('recs').doc(rid()).set({title:t,author:v('ra'),v:[uid]})}
async function vote(id){const r=R.find(x=>x.id===id),a=r.v||[];await db.collection('recs').doc(id).update({v:a.includes(uid)?a.filter(x=>x!==uid):[...a,uid]})}
/* friends + child book */
function vFr(){document.getElementById('m').innerHTML=`<div class="card"><h2><span class="e">👯</span> ${tr(5)}</h2><p class="mu">your friend code (share it): <b style="user-select:all;color:var(--g)">${uid||'sign in first'}</b></p><div class="row"><input id="fc" placeholder="friend code"><button onclick="addF()">${tr(7)} 🤝</button></div><div class="row" style="margin-top:10px">${me.friends.map(f=>`<button class="chip ${cf===f?'on':'g'}" data-u="${e(f)}" onclick="cf='${e(f)}';stop();vFr();sub()"></button>`).join('')}</div></div>${cf?'<div id="ch"></div>':''}`;paintChat();fillNames()}
function addF(){const c=v('fc').trim();if(!c||c===uid||me.friends.includes(c))return;me.friends.push(c);save();vFr()}
const days=()=>[...new Set(M.map(m=>m.day))];
function kid(){const n=days().length,st=n<1?0:n<3?1:n<7?2:n<14?3:4,nm=['egg-book','baby book','little book','teen book','grown-up book'][st],ou=['🎀','🧢','👑','🎩','🌸','🧣','🕶️','🪄'],h=[...pair(cf)].reduce((a,c)=>a+c.charCodeAt(0),0),o=st?ou[(h+st*3)%ou.length]:'',sz=60+st*22;
 return `<div style="text-align:center"><svg width="${sz+30}" height="${sz+30}" viewBox="0 0 100 100"><path d="M18 12h58a6 6 0 0 1 6 6v64a6 6 0 0 1-6 6H18z" fill="${['#ffb3c1','#ff7a95','#e0405f','#b01538','#8a0d2c'][st]}" stroke="#e9c9a0" stroke-width="3"/><path d="M18 12v76" stroke="#4a0618" stroke-width="7"/><circle cx="44" cy="46" r="5" fill="#2b0713"/><circle cx="64" cy="46" r="5" fill="#2b0713"/><circle cx="46" cy="44" r="1.6" fill="#fff"/><circle cx="66" cy="44" r="1.6" fill="#fff"/><path d="M42 60q12 12 24 0" stroke="#2b0713" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="36" cy="58" r="4" fill="#ff9db0" opacity=".7"/><circle cx="72" cy="58" r="4" fill="#ff9db0" opacity=".7"/>${st==0?'<path d="M40 14l6 8 6-8 6 8 6-8" stroke="#fff6" fill="none" stroke-width="3"/>':''}</svg><div class="big e" style="margin-top:-${sz+4}px;height:44px;position:relative">${o}</div><div style="margin-top:${sz-24}px"><b>${nm}</b> <span class="e">💖</span><div class="mu">${n} day${n==1?'':'s'} of chatting together · talk every day to help it grow</div></div></div>`}
function paintChat(){const d=document.getElementById('ch');if(!d)return;
 d.innerHTML=`<div class="card">${kid()}</div><div class="card">${M.map(m=>`<div class="msg ${m.uid===uid?'me':''}">${e(m.text)}</div>`).join('')||'<p class="mu">say hi and share a new book 📚</p>'}<div class="row"><input id="ct" style="flex:1" placeholder="write about your books today…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">${tr(9)} 💌</button></div></div>`}
async function send(){const t=v('ct').trim();if(!t||!db||!uid)return;await db.collection('msgs').doc(rid()).set({pair:pair(cf),uid,text:t,t:Date.now(),day:new Date().toISOString().slice(0,10)})}
/* assistant */
function avSvg(a,w=190){const L=a.style==='long',h=a.hair,sk=a.skin,ch=a.age<16,hs=a.ct==='hoodie';
 return `<svg width="${w}" height="${w*1.15}" viewBox="0 0 120 138"><defs><radialGradient id="hd" cx=".4" cy=".35"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient></defs><circle cx="60" cy="68" r="58" fill="#4a0a1e"/>
 ${L?`<path d="M26 50q0-34 34-34t34 34v50q-10 10-34 4-24 6-34-4z" fill="${h}"/>`:''}
 <path d="M20 138q2-30 40-30t40 30z" fill="${a.cl}"/>${a.ct==='dress'?'<path d="M40 112q20 14 40 0" stroke="#fff6" fill="none" stroke-width="3"/>':a.ct==='hoodie'?'<path d="M38 110q22 22 44 0" fill="#0003"/>':'<path d="M48 108l12 10 12-10" stroke="#fff5" fill="none" stroke-width="3"/>'}
 <rect x="52" y="90" width="16" height="20" rx="6" fill="${sk}"/><ellipse cx="60" cy="66" rx="${ch?27:25}" ry="${ch?27:29}" fill="${sk}"/><ellipse cx="60" cy="66" rx="${ch?27:25}" ry="${ch?27:29}" fill="url(#hd)"/>
 ${a.style==='curly'?`<g fill="${h}"><circle cx="36" cy="46" r="13"/><circle cx="50" cy="36" r="14"/><circle cx="70" cy="36" r="14"/><circle cx="84" cy="46" r="13"/></g>`:`<path d="M34 62q-4-36 26-38t26 38q-6-18-26-22T34 62z" fill="${h}"/>`}
 ${a.style==='bun'?`<circle cx="60" cy="18" r="11" fill="${h}"/>`:''}
 <ellipse cx="50" cy="68" rx="4" ry="5" fill="#fff"/><ellipse cx="70" cy="68" rx="4" ry="5" fill="#fff"/><circle cx="50" cy="69" r="2.8" fill="${a.eyes}"/><circle cx="70" cy="69" r="2.8" fill="${a.eyes}"/><circle cx="51" cy="68" r="1" fill="#fff"/><circle cx="71" cy="68" r="1" fill="#fff"/>
